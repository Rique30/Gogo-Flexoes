<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#100d12">
  <title>Rank Ativo</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="shell top">
    <div class="brand">RANK <span>ATIVO</span></div>
    <nav aria-label="Navegação"><a href="#missoes">Missões</a><a href="#registro">Registrar</a><a href="#exercicios">Meus exercícios</a><a href="#historico">Histórico</a></nav>
  </header>
  <main class="shell">
    <section class="hero" aria-labelledby="rank">
      <div>
        <p class="label">Seu progresso</p>
        <h1 id="rank">Rank E</h1>
        <p id="level"></p>
      </div>
      <div class="xp">
        <label for="xp-bar" id="xp-label">XP para o próximo nível</label>
        <progress id="xp-bar" value="0" max="100"></progress>
        <p id="xp-total"></p>
      </div>
    </section>
    <p id="feedback" role="status"></p>
    <div class="grid">
      <section class="card" id="missoes">
        <h2>Missões de hoje</h2>
        <p>Escolha uma meta e registre a atividade para ganhar XP extra.</p>
        <div id="missions"></div>
      </section>
      <section class="card" id="registro">
        <h2>Registrar atividade</h2>
        <form id="activity">
          <label for="kind">Atividade</label>
          <select id="kind" name="kind"></select>
          <label for="amount" id="amount-label">Repetições</label>
          <input id="amount" type="number" min="1" step="1" required inputmode="numeric">
          <div id="duration-field" hidden>
            <label for="duration">Tempo em minutos (opcional)</label>
            <input id="duration" type="number" min="1" max="1440" step="1" inputmode="numeric">
          </div>
          <button type="submit">Salvar atividade</button>
        </form>
      </section>
    </div>
    <section class="card" id="exercicios">
      <h2>Meus exercícios</h2>
      <p id="weekly-summary">0 de 4 dias de treino nesta semana</p>
      <progress id="weekly-progress" aria-labelledby="weekly-summary" max="4" value="0"></progress>
      <form id="custom-exercise">
        <label for="exercise-name">Nome do exercício</label>
        <input id="exercise-name" type="text" maxlength="60" required>
        <button type="submit">Adicionar à lista de atividades</button>
        <p id="exercise-feedback" role="status" hidden></p>
      </form>
    </section>
    <section class="card" id="historico">
      <div class="row"><h2>Histórico</h2><button id="export" class="secondary">Exportar JSON</button></div>
      <ul id="history"></ul>
    </section>
  </main>
</body>
</html>
